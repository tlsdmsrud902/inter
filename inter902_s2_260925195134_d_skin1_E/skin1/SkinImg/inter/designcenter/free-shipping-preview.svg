  <text x="46" y="55" fill="#786e63" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">CART · FREE SHIPPING</text>
  <text x="46" y="99" fill="#302821" font-family="Arial,sans-serif" font-size="24" font-weight="700">5만원 이상 구매 시 무료배송</text>
  <rect x="46" y="124" width="808" height="17" rx="9" fill="#eee6dd"/>
  <rect x="46" y="124" width="566" height="17" rx="9" fill="#687057"/>
