<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">상품 상세 재고 임박 표시 예시</title>
  <desc id="desc">상품명과 가격 아래에 재고 임박 안내를 표시하는 상품 상세 화면 예시</desc>
  <rect width="900" height="220" rx="22" fill="#ffffff" stroke="#e8dfd4" stroke-width="2"/>
  <text x="46" y="54" fill="#786e63" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PRODUCT DETAIL · STOCK ALERT</text>
  <text x="46" y="101" fill="#302821" font-family="Arial,sans-serif" font-size="24" font-weight="700">린넨 스퀘어 쿠션 베드</text>
  <text x="46" y="143" fill="#302821" font-family="Arial,sans-serif" font-size="22" font-weight="700">35,200원</text>
  <rect x="46" y="163" width="224" height="34" rx="17" fill="#fff1e8"/>
  <text x="158" y="186" text-anchor="middle" fill="#a04437" font-family="Arial,sans-serif" font-size="14" font-weight="700">재고가 얼마 남지 않았어요</text>
  <text x="310" y="182" fill="#786e63" font-family="Arial,sans-serif" font-size="14">가격 바로 아래에서 구매 전 재고 안내</text>
</svg>
