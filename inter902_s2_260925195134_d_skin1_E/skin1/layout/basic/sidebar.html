    <nav class="navigation-menu" role="navigation">
		<div data-ez-module="menu-side/1"><div id="slideCateList" class="navigation-menu__category"><ul id="slide_add_category"></ul></div></div><!-- //menu-side/1 -->
		<script>
			(function () {
				var target = document.getElementById('slide_add_category');
				if (!target) return;
				if ((window.STORE_CONTENT || {}).menu && window.STORE_CONTENT.menu.editorial) {
					var desktop = document.querySelector('.st-category-menu--left > ul');
					if (desktop) { target.innerHTML = desktop.innerHTML; target.querySelectorAll('a').forEach(function (a) { a.classList.add('view'); }); }
					return;
				}
				fetch('/exec/front/Product/SubCategory').then(function (response) { return response.json(); }).then(function (categories) {
					var config = window.SERAPHIN_CONFIG || {};
					var parentNo = Number(config.menuParentCateNo || 1);
					categories.filter(function (item) { return Number(item.parent_cate_no) === parentNo; }).slice(0, 6).forEach(function (item) {
						var li = document.createElement('li');
						var link = document.createElement('a');
						link.className = 'view'; link.href = '/product/list.html' + (item.param || '?cate_no=' + item.cate_no); link.textContent = item.name;
						li.appendChild(link); target.appendChild(li);
					});
				}).catch(function () {});
			}());
		</script>

		<div class="cboth slide_line"></div>
