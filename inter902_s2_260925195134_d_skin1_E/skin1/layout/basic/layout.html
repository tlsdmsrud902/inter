      var bg=o['상세배경']||o['배경']||D('detailBg'),fg=o['상세글자']||o['글자']||D('detailFg');
      var area=src.closest('.detailArea');if(!area)return;
      var img=area.querySelector('.imgArea');if(img)img.insertBefore(make('st-tsb','타임세일 종료까지',o.e,bg,fg),img.firstChild);
      [].forEach.call(area.querySelectorAll('.imgArea .prdImg .thumbnail'),function(th){th.appendChild(make('st-ts','종료까지',o.e,bg,fg))})})}
  function tick(){var now=Date.now();[].forEach.call(document.querySelectorAll('.st-ts,.st-tsb'),function(b){var l=b.getAttribute('data-end')-now;if(l<=0){b.parentNode.removeChild(b);return}
    if(b.className==='st-tsb'){var s=Math.floor(l/1000),v={d:Math.floor(s/86400)};s%=86400;v.h=Math.floor(s/3600);s%=3600;v.m=Math.floor(s/60);v.s=s%60;
      [].forEach.call(b.querySelectorAll('.st-u'),function(u){var k=u.getAttribute('data-k');u.style.display=(k==='d'&&!v.d)?'none':'';u.querySelector('b').textContent=k==='d'?v.d:p2(v[k])})}
    else b.querySelector('b').textContent=fmt(l)})}
  function hideRaw(){[].forEach.call(document.querySelectorAll('.detailArea tr,ul.prdList .spec>li'),function(tr){if(!tr.__h&&RE.test(tr.textContent)){tr.__h=1;tr.style.display='none'}})}
  function run(){scan();tick();hideRaw()}
  run();setInterval(run,1000);
}catch(e){}})();
</script>
<script>
/* 장바구니 무료배송 진행바 : 총 상품금액을 읽어 '○○원 더 담으면 무료배송'을 표시 (기준 금액·끄기 = store-content.js 의 shipping) */
(function(){try{
  var c=(window.STORE_CONTENT||window.storeContent||{}).shipping||{};if(c.freeBar===false)return;var T=+c.freeOver||50000;
  function num(s){return +(String(s).replace(/[^\d]/g,''))||0}
  function run(){var box=document.querySelector('.cart-total .totalSummary');if(!box)return;
    var st=box.querySelector('.totalSummary__item .heading .data strong');if(!st)return;var sum=num(st.textContent);
    var bar=document.getElementById('st-freebar');
    if(!bar){bar=document.createElement('div');bar.id='st-freebar';bar.className='st-freebar';bar.innerHTML='<div class="st-freebar__top"><span class="st-freebar__ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h11v9H3zM14 9.5h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></span><p class="st-freebar__msg"></p><span class="st-freebar__pill">FREE</span></div><div class="st-freebar__track"><i></i></div><div class="st-freebar__scale"><span>0원</span><span class="st-freebar__goal"></span></div>';box.parentNode.insertBefore(bar,box)}
    var left=T-sum;bar.querySelector('.st-freebar__msg').innerHTML=left>0?'<b>'+left.toLocaleString('ko-KR')+'원</b> 더 담으면 <em>무료배송</em>':'<em>무료배송</em> 혜택이 적용됐어요';bar.className='st-freebar'+(left>0?'':' is-done');bar.querySelector('.st-freebar__goal').textContent='무료배송 '+T.toLocaleString('ko-KR')+'원';
    bar.querySelector('i').style.width=Math.min(100,Math.max(0,sum/T*100))+'%';bar.style.display=sum>0?'':'none'}
  run();setInterval(run,1000);
}catch(e){}})();
</script>
<script>
/* 사장님 편의 기능 3종 : 재고 임박 · 기간 예약 배너 · 후기 작성 유도  (값은 store-content.js 의 stockAlert · banners · reviewPromo) */
(function(){try{
  var C=window.STORE_CONTENT||window.storeContent||{};
  function kst(t){var m=/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/.exec(t||'');return m?Date.UTC(+m[1],m[2]-1,+m[3],(+m[4]||0)-9,+m[5]||0):0}
  function hex(v){return /^#[0-9a-f]{3,8}$/i.test(v||'')?v:''}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function el(html,cls){var d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}

  /* 1) 기간 예약 배너 */
  function banner(){var L=C.banners;if(!L||!L.length)return;var now=Date.now(),b=null;
    for(var i=0;i<L.length;i++){var s=kst(L[i].start),e=kst(L[i].end);if((!s||now>=s)&&(!e||now<e)){b=L[i];break}}
    if(!b)return;var box=document.querySelector('.main_top_banner'),a=box&&box.querySelector('.top_banner_text a');if(!a)return;
    if(b.text)a.textContent=b.text;if(b.link)a.setAttribute('href',b.link);
    if(hex(b.bg))box.style.background=hex(b.bg);if(hex(b.fg))a.style.color=hex(b.fg)}

  /* 2) 재고 임박 : 재고관리를 쓰는 상품이 threshold 개 이하일 때 가격 아래에 표시 */
  function stockLeft(){var raw=window.option_stock_data||window.single_option_stock_data,j;
    try{j=typeof raw==='string'?JSON.parse(raw):raw}catch(e){return null}
    if(!j||typeof j!=='object')return null;
    if(j.use_stock!==undefined)return j.use_stock?(+j.stock_number||0):null;
    var tot=0,any=false;for(var k in j){var o=j[k];if(o&&o.use_stock){any=true;tot+=(+o.stock_number||0)}}return any?tot:null}
  function stock(){var o=C.stockAlert||{};if(o.enabled===false)return;var th=+o.threshold||5;
    var price=document.querySelector('.detailArea .infoArea .totalPrice')||document.querySelector('.detailArea .infoArea .st-pd__price');if(!price||document.getElementById('st-stock'))return;
    var n=stockLeft();if(n===null||n<1||n>th)return;
    var d=el('<span class="st-stock__pill"><i class="st-dot"></i><b>'+esc((o.text||'{n}개 남음').replace('{n}',n))+'</b><em>품절 임박</em></span>','st-stock');d.id='st-stock';price.parentNode.insertBefore(d,price.nextSibling)}

  /* 3) 후기 작성 유도 */
  function review(){var o=C.reviewPromo||{};if(o.enabled===false)return;var rv=document.getElementById('stReview'),h=rv&&rv.querySelector('.st-rv__head');
    if(!h||document.getElementById('st-rvpromo'))return;
    var a=rv.querySelector('a[href*="board/product/write"]')||document.querySelector('a[href*="board/product/write.html?board_no=4"]');
    var href=a?a.getAttribute('href'):'/board/product/list.html?board_no=4';
    var d=el('<div class="st-rvpromo__stars" aria-hidden="true">★★★★★</div><div class="st-rvpromo__txt"><p class="st-rvpromo__t">'+esc(o.text)+'</p>'+(o.points?'<span class="st-rvpromo__pt">'+esc(o.points)+'</span>':'')+'</div><a class="st-rvpromo__b" href="'+esc(href)+'">'+esc(o.button||'후기 쓰기')+' <span aria-hidden="true">→</span></a>','st-rvpromo');
    d.id='st-rvpromo';h.parentNode.insertBefore(d,h.nextSibling)}

  /* 5) 랜덤 쿠폰 뽑기용 쿠폰은 뽑기로만 받게, 상품 상세 등 다른 쿠폰 다운로드 칸에서는 숨긴다 (설정 store-content.js 의 sale.coupon) */
  function hideDraw(){var S=(C.sale||{}).coupon||{};if(S.enabled===false||S.hideElsewhere===false||!S.coupons||!S.coupons.length)return;
    var nos=S.coupons.map(function(c){return String(c.no)});
    [].forEach.call(document.querySelectorAll('.couponSkinArea li'),function(li){
      var a=li.querySelector('a[href*="coupon_no="]');var m=a&&/coupon_no=(\d+)/.exec(a.getAttribute('href')||'');if(!m||nos.indexOf(m[1])<0)return;
      var area=li.closest('.couponSkinArea'),wrap=area&&area.parentNode;li.parentNode.removeChild(li);
      if(area&&!area.querySelector('li')&&wrap)wrap.style.display='none'})}
  banner();stock();review();hideDraw();
  setTimeout(function(){stock();review();hideDraw()},1500);setTimeout(hideDraw,3500);setTimeout(hideDraw,7000);   /* 후기 영역이 늦게 그려지는 경우 */
}catch(e){}})();
</script>
<script>
/* 최상단 띠배너 X : 누르면 닫고, 오늘 자정까지 다시 띄우지 않는다 (카페24 Easy 띠배너의 기본 닫기가 동작하지 않아 직접 처리) */
(function(){
  var KEY='inter-topbanner-hide';
  function hide(b){ b.style.setProperty('display','none','important'); document.documentElement.classList.add('inter-topbanner-off'); }
  function init(){
    var b=document.querySelector('.main_top_banner'); if(!b) return;
    try{ if(Number(localStorage.getItem(KEY))>Date.now()){ hide(b); return; } }catch(e){}
    var x=b.querySelector('.top_banner_close .icoClose, .top_banner_close, .btnClose'); if(!x) return;
    x.style.cursor='pointer';
    x.addEventListener('click',function(e){
      if(e.target && e.target.matches && e.target.matches('input,label')) return;   // 체크박스·문구는 그대로 둔다
      e.preventDefault(); e.stopPropagation();
      var end=new Date(); end.setHours(24,0,0,0);
      try{ localStorage.setItem(KEY,String(end.getTime())); }catch(err){}
      hide(b);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
}());
</script>
