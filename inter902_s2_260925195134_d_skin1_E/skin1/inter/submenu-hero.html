<script>
(function(){
 var hero=document.querySelector('.inter-menu-hero');if(!hero)return;

 // 배너 내용 : 게시판 화면 관리의 '목록 위 큰 배너' 글로 바꿀 수 있다 (inter-cms.js 가 window.INTER_MENU_HERO 를 덮어쓴다)
 var banners=window.INTER_MENU_HERO=window.INTER_MENU_HERO||{

  bedroom:['scene-bed.webp','오크 침대 프레임과 흰 리넨 침구','THE BEDROOM COLLECTION','Soft linen.<br>Slow mornings.','단단한 원목 침대와 부드러운 리넨.<br>푹 쉬어 가는 침실을 만들어 보세요.'],
  dining:['scene-table.webp','원형 오크 식탁과 페이퍼코드 체어','THE DINING COLLECTION','Gather slowly.<br>Eat together.','둥근 식탁과 손으로 엮은 체어,<br>매일의 식사를 위한 다이닝 · 테이블웨어.'],
  review:['scene-wallshelf.webp','오크 벽 선반 위의 화병과 캔들 홀더','HOMES, SHARED','Real homes.<br>Real stories.','우리 집에 놓아 본 경험이 더 좋은 선택으로.<br>inter 고객의 공간 후기를 만나보세요.'],
  notice:['scene-bed.webp','오크 침대 프레임과 흰 리넨 침구','NEWS &amp; NOTICE','Little news.<br>From inter.','inter의 새로운 소식과<br>꼭 알아 두실 안내를 전해 드려요.'],

 },img=hero.querySelector('img');
